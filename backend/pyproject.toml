[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "switchmusic-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
playback = ["gamdl @ git+https://github.com/glomatico/gamdl@21901435333bdbf44d1d89b0256c21a36c035166"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["switchmusic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
