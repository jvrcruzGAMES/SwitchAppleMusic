services:
  backend:
    build: ./backend
    restart: unless-stopped
    user: "${BACKEND_UID:-1000}:${BACKEND_GID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8110:8000"
    env_file: .env
    volumes:
      - ${BACKEND_DATA_DIR:-./data}:/data
    secrets:
      - apple_key
    read_only: true
    tmpfs:
      - /tmp:size=600m,uid=${BACKEND_UID:-1000},gid=${BACKEND_GID:-1000},mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    extra_hosts:
      - "host.docker.internal:host-gateway"
secrets:
  apple_key:
    file: ${APPLE_KEY_FILE:-./secrets/AuthKey.p8}
